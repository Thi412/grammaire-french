<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Tableau — Luyện ngữ pháp tiếng Pháp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --board-green:#1c3b30;
    --board-green-dark:#12261f;
    --board-vignette:rgba(0,0,0,.35);
    --chalk-white:#f3f1e6;
    --chalk-yellow:#f2ce5f;
    --chalk-pink:#ef9fb0;
    --chalk-blue:#8fcfe0;
    --chalk-orange:#f0a860;
    --wood:#7a4a26;
    --wood-dark:#4e2f18;
    --wood-light:#a06b3c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% 0%, #2a4c3f 0%, var(--board-green) 45%, var(--board-green-dark) 100%);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color:var(--chalk-white);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:22px 12px 60px;
  }
  .frame{
    width:100%;
    max-width:900px;
    background:
      linear-gradient(180deg, var(--wood-light), var(--wood) 8%, var(--wood) 92%, var(--wood-dark));
    border-radius:18px;
    padding:16px;
    box-shadow:0 25px 60px rgba(0,0,0,.55), inset 0 0 0 2px rgba(0,0,0,.25);
  }
  .frame::before{
    content:"";
  }
  .board{
    position:relative;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.05), transparent 40%),
      radial-gradient(ellipse at 80% 70%, rgba(255,255,255,.04), transparent 45%),
      var(--board-green);
    border-radius:10px;
    box-shadow:inset 0 0 90px var(--board-vignette), inset 0 0 2px rgba(0,0,0,.5);
    min-height:560px;
    padding:28px 26px 34px;
    overflow:hidden;
  }
  .board::after{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);
    pointer-events:none;
    mix-blend-mode:overlay;
  }
  .chalk-title{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight:800;
    font-weight:700;
    letter-spacing:.5px;
  }
  .top-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:6px; position:relative; z-index:2;
  }
  .brand{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight:800;
    font-size:2rem;
    font-weight:700;
    color:var(--chalk-yellow);
    text-shadow:0 0 10px rgba(242,206,95,.25);
    display:flex; align-items:center; gap:8px;
  }
  .brand small{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size:.62rem;
    color:var(--chalk-white);
    opacity:.55;
    font-weight:400;
    letter-spacing:1px;
  }
  .btn{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background:transparent;
    border:2px dashed rgba(243,241,230,.5);
    color:var(--chalk-white);
    padding:8px 16px;
    border-radius:10px;
    cursor:pointer;
    font-size:.95rem;
    transition:transform .12s ease, background .15s ease, border-color .15s ease;
  }
  .btn:hover{ background:rgba(243,241,230,.08); border-color:var(--chalk-white); transform:translateY(-1px); }
  .btn:active{ transform:translateY(0px) scale(.98); }
  .btn.primary{
    border-style:solid;
    border-color:var(--chalk-yellow);
    color:var(--board-green-dark);
    background:var(--chalk-yellow);
    font-weight:700;
    box-shadow:0 3px 0 rgba(0,0,0,.25);
  }
  .btn.primary:hover{ filter:brightness(1.07); }
  .btn.ghost{ border-color:rgba(243,241,230,.3); opacity:.8; }
  .btn:disabled{ opacity:.35; cursor:not-allowed; transform:none; }

  /* ===== Menu screen ===== */
  .instructor-card{
    display:flex; align-items:center; gap:14px;
    background:linear-gradient(135deg, rgba(242,206,95,.08), rgba(143,207,224,.05));
    border:1px solid rgba(243,241,230,.18);
    border-radius:14px;
    padding:14px 18px;
    margin:10px 0 18px;
    position:relative; z-index:2;
  }
  .instructor-avatar{
    flex-shrink:0;
    width:46px; height:46px; border-radius:50%;
    background:rgba(242,206,95,.15);
    border:1.5px solid var(--chalk-yellow);
    color:var(--chalk-yellow);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:1.05rem;
  }
  .instructor-body{ flex:1; min-width:0; }
  .instructor-name{ font-weight:700; font-size:1.02rem; color:var(--chalk-white); line-height:1.3; }
  .instructor-cred{ font-size:.78rem; opacity:.6; line-height:1.7; }
  .instructor-price{
    flex-shrink:0;
    display:flex; flex-direction:column; align-items:flex-end; gap:2px;
  }
  .instructor-price-pill{
    background:rgba(242,206,95,.14);
    border:1px solid rgba(242,206,95,.4);
    border-radius:20px;
    padding:5px 14px;
    font-size:.85rem; font-weight:700; color:var(--chalk-yellow);
    white-space:nowrap;
  }
  .instructor-price-detail{ font-size:.72rem; opacity:.55; }
  @media (max-width:520px){
    .instructor-card{ flex-wrap:wrap; }
    .instructor-price{ align-items:flex-start; width:100%; padding-left:60px; margin-top:2px; }
  }
  .menu-header{ text-align:center; margin:8px 0 20px; position:relative; z-index:2; }
  .menu-header h1{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight:800; font-size:2.6rem; margin:4px 0 2px; color:var(--chalk-white);
  }
  .chalk-underline{
    width:220px; height:10px; margin:0 auto 8px;
    background:none;
  }
  .menu-header p{ opacity:.75; font-size:.95rem; margin:0; }
  .lesson-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:14px; position:relative; z-index:2;
  }
  .lesson-card{
    border:2px solid rgba(243,241,230,.28);
    border-radius:12px;
    padding:14px 16px;
    cursor:pointer;
    background:rgba(255,255,255,.02);
    transition:transform .14s ease, border-color .14s ease, background .14s ease;
    position:relative;
  }
  .lesson-card:hover{ transform:translateY(-3px) rotate(-.3deg); border-color:var(--chalk-yellow); background:rgba(242,206,95,.06); }
  .lesson-num{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:1.3rem; color:var(--chalk-orange); font-weight:700;
  }
  .lesson-title{ font-size:1.15rem; margin:2px 0 6px; font-weight:700; }
  .lesson-sub{ font-size:.8rem; opacity:.65; }
  .lesson-badge{
    position:absolute; top:10px; right:12px;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:.75rem;
    padding:2px 8px; border-radius:20px;
    border:1.5px solid var(--chalk-blue); color:var(--chalk-blue);
  }
  .lesson-badge.done{ border-color:var(--chalk-yellow); color:var(--chalk-yellow); }

  /* ===== Lesson header / progress ===== */
  .lesson-top{ position:relative; z-index:2; margin-bottom:16px; }
  .steps{
    display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;
  }
  .step-pill{
    font-size:.72rem; padding:4px 10px; border-radius:20px;
    border:1.5px solid rgba(243,241,230,.3); opacity:.55;
  }
  .step-pill.active{ border-color:var(--chalk-yellow); color:var(--chalk-yellow); opacity:1; font-weight:700; }
  .step-pill.past{ opacity:.85; border-color:var(--chalk-blue); }

  .card{
    background:rgba(0,0,0,.14);
    border:1.5px dashed rgba(243,241,230,.35);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:14px;
    position:relative; z-index:2;
  }
  .card h3{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight:800; font-size:1.5rem; margin:0 0 8px; color:var(--chalk-yellow);
  }
  .card ul{ margin:6px 0; padding-left:22px; }
  .card li{ margin:3px 0; }
  .ex{
    font-style:italic; color:var(--chalk-blue); margin:4px 0;
  }
  .tag{
    display:inline-block; font-size:.72rem; padding:2px 9px; border-radius:20px;
    border:1.5px solid var(--chalk-pink); color:var(--chalk-pink); margin-bottom:8px;
  }

  /* ===== Quiz ===== */
  .qcard{
    background:rgba(0,0,0,.16);
    border:1.5px solid rgba(243,241,230,.25);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:14px;
    position:relative; z-index:2;
  }
  .qmeta{ font-size:.72rem; opacity:.55; margin-bottom:4px; }
  .qtext{ font-size:1.15rem; margin-bottom:12px; }
  .options{ display:flex; flex-direction:column; gap:8px; }
  .opt{
    text-align:left;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background:transparent;
    border:2px solid rgba(243,241,230,.3);
    color:var(--chalk-white);
    padding:9px 14px;
    border-radius:9px;
    cursor:pointer;
    font-size:1rem;
  }
  .opt:hover{ border-color:var(--chalk-blue); background:rgba(143,207,224,.08); }
  .opt.selected{ border-color:var(--chalk-yellow); background:rgba(242,206,95,.12); }
  .opt.correct{ border-color:#8fd694; background:rgba(143,214,148,.15); color:#c9f2cd; }
  .opt.incorrect{ border-color:var(--chalk-pink); background:rgba(239,159,176,.15); color:#ffd6de; }
  .opt:disabled{ cursor:default; }
  .fillrow{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .fill-input{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:1.05rem;
    background:rgba(255,255,255,.06);
    border:2px solid rgba(243,241,230,.35);
    border-radius:8px; padding:8px 12px; color:var(--chalk-white);
    min-width:180px;
  }
  .fill-input:focus{ outline:none; border-color:var(--chalk-yellow); }
  .fill-input.correct{ border-color:#8fd694; }
  .fill-input.incorrect{ border-color:var(--chalk-pink); }
  .feedback{ margin-top:10px; font-size:.9rem; padding:8px 12px; border-radius:8px; }
  .feedback.ok{ background:rgba(143,214,148,.12); color:#c9f2cd; }
  .feedback.bad{ background:rgba(239,159,176,.12); color:#ffd6de; }

  .navrow{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:16px; position:relative; z-index:2; gap:10px; flex-wrap:wrap;
  }

  /* ===== Result screen ===== */
  .score-big{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight:800; font-size:4.2rem; text-align:center; color:var(--chalk-yellow);
    line-height:1; margin:4px 0 0;
  }
  .score-sub{ text-align:center; opacity:.7; margin-bottom:18px; }
  .bar-row{ display:flex; align-items:center; gap:10px; margin:9px 0; }
  .bar-label{ width:150px; font-size:.85rem; flex-shrink:0; }
  .bar-track{
    flex:1; height:12px; border-radius:8px; background:rgba(255,255,255,.08);
    border:1px solid rgba(243,241,230,.2); overflow:hidden;
  }
  .bar-fill{ height:100%; border-radius:8px; }
  .bar-pct{ width:44px; text-align:right; font-size:.82rem; flex-shrink:0; }
  .result-notes{ display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
  .note{
    flex:1; min-width:200px; border-radius:10px; padding:12px 14px;
    border:1.5px dashed rgba(243,241,230,.3);
  }
  .note h4{ margin:0 0 4px; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight:700; font-size:1.1rem; }
  .note.good h4{ color:#8fd694; }
  .note.warn h4{ color:var(--chalk-orange); }

  footer.hint{ text-align:center; opacity:.4; font-size:.75rem; margin-top:18px; position:relative; z-index:2; }

  @media (max-width:520px){
    .board{ padding:18px 14px 26px; }
    .brand{ font-size:1.5rem; }
    .menu-header h1{ font-size:2rem; }
    .score-big{ font-size:3rem; }
    .bar-label{ width:110px; font-size:.75rem; }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="board" id="board"></div>
</div>

<script>
/* ============================= DATA ============================= */
const LESSONS = [
{
  id:1, title:"Le Présent", emoji:"🇫🇷",
  rule:{tag:"Khi nào dùng?", cards:[
    {h:"Le présent dùng để nói về…", lines:[
      "• d'actions habituelles (thói quen)",
      "• de vérités générales (sự thật chung)",
      "• d'actions qui se passent maintenant (đang diễn ra)"],
      ex:["Je vais à l'école tous les jours.","Paris est la capitale de la France.","Il fait beau aujourd'hui."]},
    {h:"1er groupe: -ER — parler", lines:["je parle · tu parles · il/elle/on parle","nous parlons · vous parlez · ils/elles parlent"]},
    {h:"2e groupe: -IR — finir", lines:["je finis · tu finis · il/elle/on finit","nous finissons · vous finissez · ils/elles finissent"]},
    {h:"3e groupe (bất quy tắc, học theo cặp)", lines:["être · avoir · aller · faire","dire · pouvoir · voir · vouloir · prendre · venir"]},
  ]},
  practice:[
    {type:"mcq", cat:"Verbes -ER", q:"Je ___ français. (parler)", options:["parle","parles","parlons"], answer:0},
    {type:"fill", cat:"Verbes -ER", q:"Nous ______ français en classe. (parler)", answers:["parlons"]},
    {type:"fill", cat:"Verbes -IR", q:"Elle ______ ses devoirs à 18h. (finir)", answers:["finit"]},
    {type:"fill", cat:"Verbes irréguliers", q:"Ils ______ au travail. (aller)", answers:["vont"]},
    {type:"fill", cat:"Routine", q:"Je ______ à 7 heures. (se lever)", answers:["me lève","me leve"]},
  ],
  test:[
    {type:"fill", cat:"Conjugaison", q:"Tu _____ un stylo rouge ? (avoir)", answers:["as"]},
    {type:"fill", cat:"Conjugaison", q:"Nous ______ le français. (étudier)", answers:["étudions","etudions"]},
    {type:"fill", cat:"Conjugaison", q:"Elles ______ à Paris. (habiter)", answers:["habitent"]},
    {type:"fill", cat:"Conjugaison", q:"Il ______ ses devoirs. (faire)", answers:["fait"]},
    {type:"fill", cat:"Conjugaison", q:"Je ______ le film. (voir)", answers:["vois"]},
    {type:"fill", cat:"Routine", q:"Marie se lève à 7h. À quelle heure ______-elle ? (transformer en question)", answers:["se lève-t-elle","se leve-t-elle"]},
    {type:"fill", cat:"Routine", q:"Nous ______ tôt le matin. (se réveiller)", answers:["nous réveillons","nous reveillons"]},
    {type:"fill", cat:"Routine", q:"Vous ______ à 22h. (se coucher)", answers:["vous couchez"]},
    {type:"fill", cat:"Négation", q:"Je me lève tôt. → phủ định:", answers:["je ne me lève pas tôt","je ne me leve pas tot"]},
    {type:"fill", cat:"Négation", q:"Il parle anglais. → phủ định:", answers:["il ne parle pas anglais"]},
  ]
},

{
  id:2, title:"Les Articles Définis et Indéfinis", emoji:"📰",
  rule:{tag:"un/une/des (chưa xác định) · le/la/les (đã xác định)", cards:[
    {h:"Article indéfini — un/une/des", lines:["un + giống đực số ít · une + giống cái số ít · des + số nhiều"], ex:["un livre · un café · un étudiant","une voiture · une table · une étudiante","des livres · des voitures · des étudiants"]},
    {h:"Article défini — le/la/les", lines:["le + giống đực số ít · la + giống cái số ít · les + số nhiều"], ex:["le livre · le café · le professeur","la voiture · la table · la maison","les livres · les voitures · les étudiants"]},
    {h:"🧠 Khi nào dùng cái nào?", lines:["Lần đầu / chưa xác định → un/une/des","Đã xác định / đã biết / đã nói tới → le/la/les"], ex:["J'ai un livre. → Le livre est intéressant.","J'achète une voiture. → La voiture est rouge.","J'ai des amis. → Les amis sont français."]},
    {h:"Công thức chuyển đổi", lines:["UN → LE","UNE → LA","DES → LES"]},
  ]},
  practice:[
    {type:"mcq", cat:"Un/une/des", q:"___ livre", options:["un","une","des"], answer:0},
    {type:"mcq", cat:"Un/une/des", q:"___ voiture", options:["un","une","des"], answer:1},
    {type:"mcq", cat:"Un/une/des", q:"___ étudiants", options:["un","une","des"], answer:2},
    {type:"mcq", cat:"Le/la/les", q:"___ maison", options:["le","la","les"], answer:1},
    {type:"mcq", cat:"Le/la/les", q:"___ étudiants", options:["le","la","les"], answer:2},
    {type:"fill", cat:"Défini/Indéfini", q:"J'ai un livre. → Đổi sang xác định:", answers:["le livre"]},
    {type:"fill", cat:"Défini/Indéfini", q:"J'achète une voiture. → Đổi sang xác định:", answers:["la voiture"]},
    {type:"fill", cat:"Transformation", q:"J'ai des enfants. → Đổi sang xác định:", answers:["les enfants"]},
  ],
  test:[
    {type:"fill", cat:"Un/une/des", q:"___ étudiant", answers:["un"]},
    {type:"fill", cat:"Un/une/des", q:"___ étudiante", answers:["une"]},
    {type:"fill", cat:"Un/une/des", q:"___ étudiants", answers:["des"]},
    {type:"fill", cat:"Un/une/des", q:"___ table", answers:["une"]},
    {type:"fill", cat:"Le/la/les", q:"___ étudiant (đã biết)", answers:["le"]},
    {type:"fill", cat:"Le/la/les", q:"___ étudiante (đã biết)", answers:["la"]},
    {type:"fill", cat:"Le/la/les", q:"___ livres (đã biết)", answers:["les"]},
    {type:"fill", cat:"Transformation", q:"J'ai un chien. → Comment parler du même chien ?", answers:["le chien"]},
    {type:"fill", cat:"Transformation", q:"J'ai une voiture. →", answers:["la voiture"]},
    {type:"fill", cat:"Transformation", q:"J'ai des enfants. →", answers:["les enfants"]},
  ]
},

{
  id:3, title:"Les Verbes Pronominaux", emoji:"🌞",
  rule:{tag:"Routine quotidienne", cards:[
    {h:"Đại từ phản thân", lines:["je→me · tu→te · il/elle→se","nous→nous · vous→vous · ils/elles→se"], ex:["Je me lève. · Tu te couches.","Elle se réveille. · Nous nous lavons."]},
    {h:"Phủ định", ex:["Je me lève tôt. → Je ne me lève pas tôt.","❌ Je me ne lève pas."]},
  ]},
  practice:[
    {type:"mcq", cat:"Pronom", q:"Je ___ lève à 6h30.", options:["me","te","se"], answer:0},
    {type:"mcq", cat:"Pronom", q:"Nous ___ lavons le matin.", options:["vous","nous","se"], answer:1},
    {type:"fill", cat:"Conjugaison", q:"Elle ______ rapidement. (s'habiller)", answers:["s'habille","s habille"]},
    {type:"fill", cat:"Négation", q:"Je me lève tôt. → phủ định:", answers:["je ne me lève pas tôt","je ne me leve pas tot"]},
  ],
  test:[
    {type:"fill", cat:"Pronom", q:"Elle ___ douche le matin.", answers:["se"]},
    {type:"fill", cat:"Pronom", q:"Ils ___ réveillent à 7h.", answers:["se"]},
    {type:"fill", cat:"Compréhension", q:"Thomas se lève à 6 heures 30. À quelle heure se lève-t-il ?", answers:["6h30","6 heures 30","à 6h30"]},
    {type:"fill", cat:"Négation", q:"Nous nous couchons à 22 heures. → phủ định:", answers:["nous ne nous couchons pas à 22 heures","nous ne nous couchons pas a 22 heures"]},
  ]
},

{
  id:4, title:"Le Passé Composé", emoji:"⏳",
  rule:{tag:"Une action passée et terminée", cards:[
    {h:"Công thức", lines:["AUXILIAIRE (avoir/être) + PARTICIPE PASSÉ"], ex:["Hier, j'ai mangé au restaurant.","Le soir, j'ai regardé un film.","Je suis allé(e) au parc."]},
    {h:"AVOIR — phần lớn động từ", lines:["j'ai · tu as · il/elle a · nous avons · vous avez · ils/elles ont"]},
    {h:"ÊTRE — di chuyển & động từ phản thân", lines:["aller, venir, arriver, partir, entrer, sortir, monter, descendre, rentrer, retourner, passer"], ex:["Il est arrivé. / Elle est arrivée.","Ils sont partis. / Elles sont parties."]},
    {h:"Participe passé", lines:["-er → é (manger→mangé, regarder→regardé)","finir→fini · prendre→pris · écrire→écrit · boire→bu · voir→vu · mettre→mis"]},
  ]},
  practice:[

    {h:"Superlatif — nhất trong một nhóm", lines:["le/la/les + PLUS + adjectif = nhất","le/la/les + MOINS + adjectif = ít nhất"], ex:["C'est le plus grand.","C'est la moins intéressante.","Ce sont les plus intéressants."]},

{

  rule:{tag:"Cause · conséquence · opposition · concession · but", cards:[
    {h:"🟢 CAUSE — tại sao?", lines:["parce que (nói) · car (viết, lập luận)"], ex:["Je reste chez moi parce qu'il pleut.","Je reste chez moi, car il pleut."]},
    {h:"🔵 CONSÉQUENCE — kết quả gì?", lines:["donc · alors · c'est pourquoi"], ex:["Il pleut, donc je reste chez moi.","Il est tard, alors je rentre chez moi."]},
    {h:"🟠 OPPOSITION — đối lập?", lines:["mais (cơ bản) → cependant / pourtant (tránh lặp, formal hơn)"], ex:["J'aime cette ville, mais elle est chère.","Il travaille beaucoup. Pourtant, il n'a pas de bons résultats."]},
    {h:"🟣 CONCESSION — malgré cela?", lines:["BIEN QUE + SUBJONCTIF (bắt buộc)"], ex:["Bien qu'il soit fatigué, il continue à travailler.","❌ Bien qu'il est fatigué."]},
    {h:"🟡 BUT — mục đích?", lines:["Cùng chủ ngữ → POUR + infinitif","Khác chủ ngữ → POUR QUE + subjonctif"], ex:["Je travaille pour gagner de l'argent.","Je parle lentement pour que les étudiants puissent comprendre."]},

function getLesson(id){ return LESSONS.find(l=>l.id===id); }

/* ============================= HELPERS ============================= */
function norm(s){
  return (s||'').toString().trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // strip accents for lenient compare fallback
    .replace(/\s+/g,' ');
}
function checkFill(userVal, answers){
  const u = norm(userVal);
  return answers.some(a => norm(a) === u);
}
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;
  return e;
}

  else if(state.screen==='translate-menu') renderTranslateMenu();
  else if(state.screen==='translate-levels') renderTranslateLevels();
  else if(state.screen==='translate-practice') renderTranslatePractice();
  else if(state.screen==='translate-result') renderTranslateResult();
  else if(state.screen==='translate-summary') renderTranslateSummary();
}

function renderQuestion(item, onAnswer){
  const qcard = el('div','qcard');
  qcard.appendChild(el('div','qmeta', item.cat));
  qcard.appendChild(el('div','qtext', item.q));
  if(item.type==='mcq'){
    const opts = el('div','options');
    let answered=false;
    item.options.forEach((optText,i)=>{
      const b = el('button','opt', optText);
      b.onclick = ()=>{
        if(answered) return; answered=true;
        const correct = i===item.answer;
        [...opts.children].forEach((c,j)=>{
          c.disabled=true;
          if(j===item.answer) c.classList.add('correct');
          else if(j===i) c.classList.add('incorrect');
        });
        const fb = el('div','feedback '+(correct?'ok':'bad'), correct? '✅ Chính xác!' : '❌ Đáp án đúng: '+item.options[item.answer]);
        qcard.appendChild(fb);
        setTimeout(()=> onAnswer(correct), 550);
      };
      opts.appendChild(b);
    });
    qcard.appendChild(opts);
  } else {
    const row = el('div','fillrow');
    const input = el('input','fill-input');
    input.type='text'; input.placeholder='Nhập câu trả lời…';
    const submit = el('button','btn primary','Kiểm tra');
    let answered=false;
    const doCheck = ()=>{
      if(answered) return; answered=true;
      const correct = checkFill(input.value, item.answers);
      input.classList.add(correct?'correct':'incorrect');
      input.disabled=true; submit.disabled=true;
      const fb = el('div','feedback '+(correct?'ok':'bad'), correct? '✅ Chính xác!' : '❌ Đáp án đúng: '+item.answers[0]);
      qcard.appendChild(fb);
      setTimeout(()=> onAnswer(correct), 550);
    };
    submit.onclick = doCheck;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') doCheck(); });
    row.appendChild(input); row.appendChild(submit);
    qcard.appendChild(row);
    setTimeout(()=>input.focus(), 30);
  }
  return qcard;
}

  if(idx>=total){
    const card = el('div','card');
    card.appendChild(el('h3','','Xong phần luyện tập! 🎉'));
    card.appendChild(el('div','','Sẵn sàng làm Mini‑test chưa?'));

    nav.appendChild(el('div',''));
    const next = el('button','btn primary','Vào Mini‑test →');
    next.onclick = ()=>{ state.screen='test'; state.testIdx=0; state.testAnswers=[]; render(); };
    nav.appendChild(next);
    board.appendChild(nav);
    return;
  }
  const progress = el('div','tag','Pratique '+(idx+1)+' / '+total);
  board.appendChild(progress);

function renderTest(){
  const l = renderLessonTop(2);
  const idx = state.testIdx;
  const total = l.test.length;
  if(idx>=total){
    computeResultAndGo();
    return;
  }
  const progress = el('div','tag','Mini‑test '+(idx+1)+' / '+total);
  board.appendChild(progress);
  const item = l.test[idx];
  const qcard = renderQuestion(item, (correct)=>{
    state.testAnswers.push({cat:item.cat, correct});
    state.testIdx++;
    render();
  });
  board.appendChild(qcard);
}

function computeResultAndGo(){
  const l = getLesson(state.lessonId);
  const total = state.testAnswers.length;
  const correct = state.testAnswers.filter(a=>a.correct).length;
  const score = total? Math.round(correct/total*100) : 0;

  const byCat = {};
  state.testAnswers.forEach(a=>{
    if(!byCat[a.cat]) byCat[a.cat] = {c:0,t:0};
    byCat[a.cat].t++;
    if(a.correct) byCat[a.cat].c++;
  });
  const catPct = Object.entries(byCat).map(([cat,v])=>({cat, pct:Math.round(v.c/v.t*100)}));
  catPct.sort((a,b)=>b.pct-a.pct);

  state.finished[l.id] = {score, catPct, correct, total};
  state.screen='result';
  render();
}

function barColor(pct){
  if(pct>=80) return '#8fd694';
  if(pct>=60) return '#f2ce5f';
  return '#ef9fb0';
}

function renderResult(){
  const l = renderLessonTop(3);
  const res = state.finished[l.id];
  board.appendChild(el('div','score-big', res.score+'%'));
  board.appendChild(el('div','score-sub', res.correct+' / '+res.total+' câu đúng — '+l.title));

  const card = el('div','card');
  res.catPct.forEach(cp=>{
    const row = el('div','bar-row');
    row.appendChild(el('div','bar-label', cp.cat));
    const track = el('div','bar-track');
    const fill = el('div','bar-fill');
    fill.style.width = cp.pct+'%';
    fill.style.background = barColor(cp.pct);
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el('div','bar-pct', cp.pct+'%'));
    card.appendChild(row);
  });
  board.appendChild(card);

  const strong = res.catPct.filter(c=>c.pct>=80).map(c=>c.cat);
  const weak = res.catPct.filter(c=>c.pct<80).sort((a,b)=>a.pct-b.pct).map(c=>c.cat);
  const notes = el('div','result-notes');
  if(strong.length){
    const n = el('div','note good');
    n.appendChild(el('h4','','🟢 Tu maîtrises'));
    n.appendChild(el('div','', strong.join(', ')));
    notes.appendChild(n);
  }
  if(weak.length){
    const n = el('div','note warn');
    n.appendChild(el('h4','','🟠 À revoir'));
    n.appendChild(el('div','', weak.join(', ')));
    notes.appendChild(n);
  }
  board.appendChild(notes);

  const nav = el('div','navrow');
  const retry = el('button','btn ghost','↺ Làm lại mini‑test');
  retry.onclick = ()=>{ state.screen='test'; state.testIdx=0; state.testAnswers=[]; render(); };
  const menu = el('button','btn primary','Về danh sách bài →');
  menu.onclick = ()=>{ state.screen='menu'; state.lessonId=null; render(); };
  nav.appendChild(retry); nav.appendChild(menu);
  board.appendChild(nav);
}

    card.appendChild(el('div','lesson-num', lvl.title));
    card.appendChild(el('div','lesson-title', lvl.sub));
    card.appendChild(el('div','lesson-sub', lvl.sentences.length+' câu dịch'));
    card.onclick = ()=>{
      translateState.levelIdx = idx; translateState.sentenceIdx = 0;
      translateState.checked = false; translateState.autoCorrect = null; translateState.resolved = false;
      state.screen = 'translate-practice'; render();
    };
    grid.appendChild(card);
  });
  board.appendChild(grid);

  const summaryCard = el('div','card');
  summaryCard.style.cursor = 'pointer';
  summaryCard.style.borderStyle = 'solid';
  summaryCard.style.borderColor = 'var(--chalk-pink)';
  summaryCard.appendChild(el('h3','', translateState.currentSummary.title));
  summaryCard.appendChild(el('div','','Bài tổng hợp: dịch một đoạn dài kết hợp lại toàn bộ ngữ pháp của phần này.'));
  summaryCard.onclick = ()=>{ translateState.summaryDone=false; translateState.summaryTagged={}; state.screen='translate-summary'; render(); };
  board.appendChild(summaryCard);
}

function renderTranslatePractice(){
  const level = translateState.currentLevels[translateState.levelIdx];
  translateTopRow('← Chọn bài khác', ()=>{ state.screen='translate-levels'; render(); });

  const top = el('div','lesson-top');
  top.appendChild(el('div','chalk-title', level.title+' — '+level.sub));
  board.appendChild(top);

  const idx = translateState.sentenceIdx;
  if(idx >= level.sentences.length){
    const card = el('div','card');
    card.appendChild(el('h3','','Hoàn thành bài này! 🎉'));
    card.appendChild(el('div','','Xem báo cáo Grammar Tracking để biết điểm ngữ pháp nào cần luyện thêm.'));
    board.appendChild(card);
    const nav = el('div','navrow');
    const back = el('button','btn ghost','← Chọn bài khác');
    back.onclick = ()=>{ state.screen='translate-levels'; render(); };
    const report = el('button','btn primary','Xem Grammar Tracking →');
    report.onclick = ()=>{ state.screen='translate-result'; render(); };
    nav.appendChild(back); nav.appendChild(report);
    board.appendChild(nav);
    return;
  }

  const progress = el('div','tag', 'Câu '+(idx+1)+' / '+level.sentences.length);
  board.appendChild(progress);

  const sentence = level.sentences[idx];
  const qcard = el('div','qcard');
  qcard.appendChild(el('div','qmeta', 'Dịch sang tiếng Pháp'));
  qcard.appendChild(el('div','qtext', '🇻🇳 '+sentence.vi));

  const textarea = document.createElement('textarea');
  textarea.className = 'fill-input';
  textarea.style.width = '100%';
  textarea.style.minHeight = '70px';
  textarea.style.resize = 'vertical';
  textarea.placeholder = 'Nhập bản dịch tiếng Pháp của bạn…';
  textarea.disabled = translateState.checked;
  qcard.appendChild(textarea);

  const actionRow = el('div','fillrow');
  actionRow.style.marginTop = '10px';

  if(!translateState.checked){
    const checkBtn = el('button','btn primary','Kiểm tra');
    checkBtn.onclick = ()=>{
      const correct = checkTranslate(textarea.value, sentence.fr);
      translateState.checked = true;
      translateState.autoCorrect = correct;
      translateState.resolved = correct; // auto-resolved only when it matched
      if(correct){
        sentence.tags.forEach(tag=>{
          if(!translateState.tagScores[tag]) translateState.tagScores[tag] = {c:0,t:0};
          translateState.tagScores[tag].t++;
          translateState.tagScores[tag].c++;
        });
      }
      render();
    };
    actionRow.appendChild(checkBtn);
    qcard.appendChild(actionRow);
  } else {
    const modelCard = el('div','card');
    modelCard.appendChild(el('h3','','Câu mẫu'));
    modelCard.appendChild(el('div','ex', '"'+sentence.fr[0]+'"'));
    const tagsRow = el('div','');
    sentence.tags.forEach(t=>{
      const chip = el('span','tag', t);
      chip.style.marginRight = '6px';
      tagsRow.appendChild(chip);
    });
    modelCard.appendChild(tagsRow);
    qcard.appendChild(modelCard);

    if(translateState.autoCorrect){
      qcard.appendChild(el('div','feedback ok', '✅ Khớp với đáp án mẫu!'));
      const nextBtn = el('button','btn primary','Câu tiếp →');
      nextBtn.style.marginTop = '10px';
      nextBtn.onclick = ()=>{
        translateState.sentenceIdx++; translateState.checked=false;
        translateState.autoCorrect=null; translateState.resolved=false;
        render();
      };
      qcard.appendChild(nextBtn);
    } else if(!translateState.resolved){
      qcard.appendChild(el('div','feedback bad', '⚠️ Chưa khớp chính xác với đáp án mẫu. So sánh câu của bạn với câu mẫu ở trên, rồi tự đánh giá:'));
      const selfRow = el('div','fillrow');
      selfRow.style.marginTop = '10px';
      const okBtn = el('button','btn','✅ Mình dịch đúng nghĩa & ngữ pháp');
      const noBtn = el('button','btn ghost','🔁 Mình cần luyện thêm');
      okBtn.onclick = ()=>{
        translateState.resolved = true; translateState.autoCorrect = true;
        sentence.tags.forEach(tag=>{
          if(!translateState.tagScores[tag]) translateState.tagScores[tag] = {c:0,t:0};
          translateState.tagScores[tag].t++;
          translateState.tagScores[tag].c++;
        });
        render();
      };
      noBtn.onclick = ()=>{
        translateState.resolved = true; translateState.autoCorrect = false;
        sentence.tags.forEach(tag=>{
          if(!translateState.tagScores[tag]) translateState.tagScores[tag] = {c:0,t:0};
          translateState.tagScores[tag].t++;
        });
        render();
      };
      selfRow.appendChild(okBtn); selfRow.appendChild(noBtn);
      qcard.appendChild(selfRow);
    } else {
      qcard.appendChild(el('div','feedback '+(translateState.autoCorrect?'ok':'bad'), translateState.autoCorrect? '✅ Đã ghi nhận: đúng.' : '🔁 Đã ghi nhận: cần luyện thêm.'));
      const nextBtn = el('button','btn primary','Câu tiếp →');
      nextBtn.style.marginTop = '10px';
      nextBtn.onclick = ()=>{
        translateState.sentenceIdx++; translateState.checked=false;
        translateState.autoCorrect=null; translateState.resolved=false;
        render();
      };
      qcard.appendChild(nextBtn);
    }
  }

  board.appendChild(qcard);
}

function renderTranslateResult(){
  translateTopRow('← Chọn phần', ()=>{ state.screen='translate-menu'; render(); });

  const header = el('div','menu-header');
  header.appendChild(el('h1','','📊 Grammar Tracking'));
  header.appendChild(el('p','','Tổng hợp kết quả theo từng điểm ngữ pháp bạn đã vận dụng trong module dịch.'));
  board.appendChild(header);

  const tags = Object.entries(translateState.tagScores).map(([tag,v])=>({tag, pct: Math.round(v.c/v.t*100), c:v.c, t:v.t}));
  if(tags.length === 0){
    const card = el('div','card');
    card.appendChild(el('div','','Chưa có dữ liệu — hãy làm ít nhất một level dịch trước.'));
    board.appendChild(card);
  } else {
    tags.sort((a,b)=>a.pct-b.pct);
    const card = el('div','card');
    tags.forEach(t=>{
      const row = el('div','bar-row');
      row.appendChild(el('div','bar-label', t.tag));
      const track = el('div','bar-track');
      const fill = el('div','bar-fill');
      fill.style.width = t.pct+'%';
      fill.style.background = barColor(t.pct);
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el('div','bar-pct', t.pct+'%'));
      card.appendChild(row);
    });
    board.appendChild(card);

    const weak = tags.filter(t=>t.pct<70).map(t=>t.tag);
    if(weak.length){
      const notes = el('div','result-notes');
      const n = el('div','note warn');
      n.appendChild(el('h4','','🟠 Yếu nhất — nên luyện thêm'));
      n.appendChild(el('div','', weak.join(', ')));
      notes.appendChild(n);
      board.appendChild(notes);
    }
  }

  const nav = el('div','navrow');
  const back = el('button','btn ghost','← Chọn phần');
  back.onclick = ()=>{ state.screen='translate-menu'; render(); };
  const menu = el('button','btn primary','Về danh sách bài học →');
  menu.onclick = ()=>{ state.screen='menu'; render(); };
  nav.appendChild(back); nav.appendChild(menu);
  board.appendChild(nav);
}

function renderTranslateSummary(){
  translateTopRow('← Chọn bài khác', ()=>{ state.screen='translate-levels'; render(); });

  const summary = translateState.currentSummary;
  const header = el('div','menu-header');
  header.appendChild(el('h1','', summary.title));
  header.appendChild(el('p','','Dịch cả đoạn — không có đáp án đúng/sai tuyệt đối, hãy so sánh với câu mẫu rồi tự đánh dấu những điểm ngữ pháp bạn đã dùng đúng.'));
  board.appendChild(header);

  const qcard = el('div','qcard');
  qcard.appendChild(el('div','qmeta','Dịch sang tiếng Pháp'));
  qcard.appendChild(el('div','qtext','🇻🇳 '+summary.vi));

  const textarea = document.createElement('textarea');
  textarea.className = 'fill-input';
  textarea.style.width = '100%';
  textarea.style.minHeight = '110px';
  textarea.style.resize = 'vertical';
  textarea.placeholder = 'Nhập bản dịch tiếng Pháp của cả đoạn…';
  textarea.disabled = translateState.summaryDone;
  qcard.appendChild(textarea);

  const actionRow = el('div','fillrow');
  actionRow.style.marginTop = '10px';

  if(!translateState.summaryDone){
    const revealBtn = el('button','btn primary','Xem đáp án mẫu');
    revealBtn.onclick = ()=>{ translateState.summaryDone = true; render(); };
    actionRow.appendChild(revealBtn);
    qcard.appendChild(actionRow);
  } else {
    const modelCard = el('div','card');
    modelCard.appendChild(el('h3','','Đoạn mẫu'));
    modelCard.appendChild(el('div','ex', '"'+summary.fr+'"'));
    qcard.appendChild(modelCard);

    const tagCard = el('div','card');
    tagCard.appendChild(el('h3','','🎯 Grammar được recycle — bấm vào điểm bạn đã dùng đúng'));
    const tagWrap = el('div','');
    summary.tags.forEach(tag=>{
      const used = !!translateState.summaryTagged[tag];
      const chip = el('span','tag', (used?'✅ ':'') + tag);
      chip.style.marginRight = '6px';
      chip.style.marginBottom = '6px';
      chip.style.display = 'inline-block';
      chip.style.cursor = 'pointer';
      if(used){ chip.style.borderColor = '#8fd694'; chip.style.color = '#c9f2cd'; }
      chip.onclick = ()=>{
        translateState.summaryTagged[tag] = !translateState.summaryTagged[tag];
        if(!translateState.tagScores[tag]) translateState.tagScores[tag] = {c:0,t:0};
        render();
      };
      tagWrap.appendChild(chip);
    });
    tagCard.appendChild(tagWrap);
    qcard.appendChild(tagCard);

    const submitBtn = el('button','btn primary','Ghi nhận kết quả →');
    submitBtn.style.marginTop='10px';
    submitBtn.onclick = ()=>{
      summary.tags.forEach(tag=>{
        if(!translateState.tagScores[tag]) translateState.tagScores[tag] = {c:0,t:0};
        translateState.tagScores[tag].t++;
        if(translateState.summaryTagged[tag]) translateState.tagScores[tag].c++;
      });
      state.screen='translate-result'; render();
    };
    qcard.appendChild(submitBtn);
  }

  board.appendChild(qcard);
}

render();
</script>
</body>
</html>
